name: Prepare iOS project
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  prepare:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and create iOS project
        run: npm run setup
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: gym-tracker-ios-project
          path: ios
