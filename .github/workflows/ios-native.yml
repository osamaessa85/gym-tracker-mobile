name: Build iOS project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate 2>&1 | tee ../ios_debug_log.txt
      - name: Build unsigned iOS app
        working-directory: ios-native
        run: xcodebuild -project GymTrackerApp.xcodeproj -scheme GymTrackerApp -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a ../ios_debug_log.txt
      - name: Commit debug log (always, so failures are readable outside Actions UI)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios_debug_log.txt
          git diff --cached --quiet && echo "no changes" || git commit -m "iOS build debug log [skip ci]"
          git push
